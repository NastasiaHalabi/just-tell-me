name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v5
        with:
          name: just-tell-me-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: Android preview APK
          body: |
            Sideload `app-debug.apk` on your phone (not from Play Store).
            After install, open Settings in the app and set the planner URL to `http://YOUR_PC_IP:8080`.
          files: mobile/build/app/outputs/flutter-apk/app-debug.apk
          make_latest: true
      - name: Show Flutter doctor on failure
        if: failure()
        run: flutter doctor -v
