name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: |
          set -euo pipefail
          dest="build/app/outputs/flutter-apk"
          mkdir -p "$dest"
          flutter build apk --debug || true
          if [ ! -f "$dest/app-debug.apk" ]; then
            found="$(find "$(pwd)" "$(pwd)/android" "$(pwd)/build" -name 'app-debug.apk' 2>/dev/null | head -n 1 || true)"
            echo "Flutter did not report the APK. Searching. Found: ${found:-none}"
            if [ -n "${found:-}" ]; then
              cp "$found" "$dest/app-debug.apk"
            fi
          fi
          if [ ! -f "$dest/app-debug.apk" ]; then
            echo "No app-debug.apk under mobile/"
            find "$(pwd)" "$(pwd)/android" -name '*.apk' -print || true
            exit 1
          fi
          ls -lh "$dest/app-debug.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: just-tell-me-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          notes=$'Sideload `app-debug.apk` on your phone (not from Play Store).\nAfter install, open Settings in the app and set the planner URL to `http://YOUR_PC_IP:8080`.'
          for attempt in 1 2 3 4 5 6; do
            if gh release view android-preview >/dev/null 2>&1; then
              gh release upload android-preview "$apk" --clobber && exit 0
            else
              gh release create android-preview "$apk" --title "Android preview APK" --notes "$notes" --latest && exit 0
            fi
            echo "Release API attempt ${attempt} failed; waiting for GitHub..."
            sleep $((attempt * 20))
          done
          echo "GitHub Releases API is unavailable. Download the just-tell-me-debug artifact from this run instead."
          exit 0
      - name: Show Flutter doctor on failure
        if: failure()
        run: flutter doctor -v
